<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-label="The five layers of an LLM product and the risk each one introduces">
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e2836" stroke-width="1"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f43f5e"/></marker>
</defs>
<rect width="1180" height="760" fill="#0b0f17"/>
<rect width="1180" height="760" fill="url(#g)" opacity="0.5"/>
<text x="60" y="62" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8edf5">The LLM Stack</text><text x="60" y="88" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8b9bb4">Five layers sit between a file of weights and a product. Every one of them is an attack surface.</text><rect x="42" y="40" width="6" height="48" rx="3" fill="#ff7a1a"/><rect x="60" y="150" width="700" height="96" rx="10" fill="#131a26" stroke="#38bdf8" stroke-width="1.5"/><rect x="60" y="150" width="6" height="96" rx="3" fill="#38bdf8"/><text x="84" y="182" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">User Interface</text><text x="84" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Chat window · API client · IDE plug-in · voice · embedded widget</text><text x="84" y="228" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#38bdf8" text-anchor="start" opacity="1">&#9888; Client-side capture, extension snooping, cached input</text><line x1="760" y1="198" x2="800" y2="198" stroke="#8b9bb4" stroke-width="1.2" marker-end="url(#ar)" opacity="0.6"/><rect x="60" y="260" width="700" height="96" rx="10" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><rect x="60" y="260" width="6" height="96" rx="3" fill="#ff7a1a"/><text x="84" y="292" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Application Layer</text><text x="84" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">System prompt · session mgmt · input/output handling · authn/authz</text><text x="84" y="338" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff7a1a" text-anchor="start" opacity="1">&#9888; System prompt leakage, missing redaction, full-context logging</text><line x1="760" y1="308" x2="800" y2="308" stroke="#8b9bb4" stroke-width="1.2" marker-end="url(#ar)" opacity="0.6"/><rect x="60" y="370" width="700" height="96" rx="10" fill="#131a26" stroke="#a855f7" stroke-width="1.5"/><rect x="60" y="370" width="6" height="96" rx="3" fill="#a855f7"/><text x="84" y="402" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Orchestration Layer</text><text x="84" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Retrieval pipelines · tool routing · agent loop · memory</text><text x="84" y="448" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#a855f7" text-anchor="start" opacity="1">&#9888; Indirect injection, tool chaining, runaway loops, confused deputy</text><line x1="760" y1="418" x2="800" y2="418" stroke="#8b9bb4" stroke-width="1.2" marker-end="url(#ar)" opacity="0.6"/><rect x="60" y="480" width="700" height="96" rx="10" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><rect x="60" y="480" width="6" height="96" rx="3" fill="#34d399"/><text x="84" y="512" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Model API</text><text x="84" y="536" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Inference endpoint · token limits · moderation hooks · streaming</text><text x="84" y="558" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#34d399" text-anchor="start" opacity="1">&#9888; API key exposure, parameter tampering, provider-side logging</text><line x1="760" y1="528" x2="800" y2="528" stroke="#8b9bb4" stroke-width="1.2" marker-end="url(#ar)" opacity="0.6"/><rect x="60" y="590" width="700" height="96" rx="10" fill="#131a26" stroke="#fbbf24" stroke-width="1.5"/><rect x="60" y="590" width="6" height="96" rx="3" fill="#fbbf24"/><text x="84" y="622" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Infrastructure</text><text x="84" y="646" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">GPU clusters · model weights · logging · access control · billing</text><text x="84" y="668" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" opacity="1">&#9888; Exposed endpoints, LLMjacking, weight theft, cost exhaustion</text><line x1="760" y1="638" x2="800" y2="638" stroke="#8b9bb4" stroke-width="1.2" marker-end="url(#ar)" opacity="0.6"/><rect x="810" y="150" width="310" height="206" rx="10" fill="#182130" stroke="#ff7a1a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="830" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ff7a1a" text-anchor="start" opacity="1">DEVELOPER RESPONSIBILITY</text><text x="830" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">Application, prompts, guardrails,</text><text x="830" y="232" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">session state, logging, tool scope.</text><text x="830" y="262" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8b9bb4" text-anchor="start" opacity="1">This is where most real-world</text><text x="830" y="282" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8b9bb4" text-anchor="start" opacity="1">AI security failures actually live —</text><text x="830" y="302" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8b9bb4" text-anchor="start" opacity="1">not in the model weights.</text><rect x="830" y="322" width="103" height="22" rx="11" fill="#ff7a1a" opacity="0.15"/><rect x="830" y="322" width="103" height="22" rx="11" fill="none" stroke="#ff7a1a" stroke-width="1"/><text x="881.4" y="337.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#ff7a1a" text-anchor="middle" opacity="1">you own this</text><rect x="810" y="370" width="310" height="206" rx="10" fill="#182130" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/><text x="830" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start" opacity="1">PROVIDER RESPONSIBILITY</text><text x="830" y="430" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">Training, weights, base API,</text><text x="830" y="452" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">platform moderation, uptime.</text><text x="830" y="482" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8b9bb4" text-anchor="start" opacity="1">Trust here is baked in at training</text><text x="830" y="502" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8b9bb4" text-anchor="start" opacity="1">time — you cannot configure it,</text><text x="830" y="522" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#8b9bb4" text-anchor="start" opacity="1">and you cannot audit it.</text><rect x="830" y="542" width="132" height="22" rx="11" fill="#34d399" opacity="0.15"/><rect x="830" y="542" width="132" height="22" rx="11" fill="none" stroke="#34d399" stroke-width="1"/><text x="896.2" y="557.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" opacity="1">you inherit this</text><rect x="810" y="590" width="310" height="110" rx="10" fill="#182130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/><text x="830" y="622" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" opacity="1">SHARED</text><text x="830" y="650" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">Data handling, abuse prevention,</text><text x="830" y="672" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">residency, retention, incident response.</text><text x="60" y="730" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8b9bb4" text-anchor="start" opacity="1">Relying on model-level safety training alone is not a security architecture. Controls must exist at every layer.</text></svg>
