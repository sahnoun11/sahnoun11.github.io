<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-label="The principal hierarchy in an LLM system">
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e2836" stroke-width="1"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f43f5e"/></marker>
</defs>
<rect width="1080" height="680" fill="#0b0f17"/>
<rect width="1080" height="680" fill="url(#g)" opacity="0.5"/>
<text x="60" y="62" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8edf5">Who the Model Takes Orders From</text><text x="60" y="88" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8b9bb4">Four principals, four trust levels — and the model can cryptographically verify none of them.</text><rect x="42" y="40" width="6" height="48" rx="3" fill="#ff7a1a"/><rect x="60" y="140" width="880" height="88" rx="12" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><rect x="60" y="140" width="6" height="88" rx="3" fill="#34d399"/><text x="84" y="172" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Model provider</text><text x="231.0" y="172" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">— Anthropic · OpenAI · Google</text><text x="84" y="200" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Baked in at training time. Cannot be overridden by a prompt.</text><rect x="792" y="158" width="110" height="22" rx="11" fill="#34d399" opacity="0.15"/><rect x="792" y="158" width="110" height="22" rx="11" fill="none" stroke="#34d399" stroke-width="1"/><text x="847.1" y="173.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" opacity="1">HIGHEST TRUST</text><rect x="100" y="244" width="800" height="88" rx="12" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><rect x="100" y="244" width="6" height="88" rx="3" fill="#ff7a1a"/><text x="124" y="276" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Application developer</text><text x="344.5" y="276" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">— the system prompt</text><text x="124" y="304" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Communicated at runtime. Anyone who can write to this position inherits the trust.</text><rect x="752" y="262" width="88" height="22" rx="11" fill="#ff7a1a" opacity="0.15"/><rect x="752" y="262" width="88" height="22" rx="11" fill="none" stroke="#ff7a1a" stroke-width="1"/><text x="796.0" y="277.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#ff7a1a" text-anchor="middle" opacity="1">HIGH TRUST</text><rect x="140" y="348" width="720" height="88" rx="12" fill="#131a26" stroke="#38bdf8" stroke-width="1.5"/><rect x="140" y="348" width="6" height="88" rx="3" fill="#38bdf8"/><text x="164" y="380" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">End user</text><text x="248.0" y="380" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">— the human turn</text><text x="164" y="408" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Lower authority than the system prompt — by convention, not by enforcement.</text><rect x="712" y="366" width="103" height="22" rx="11" fill="#38bdf8" opacity="0.15"/><rect x="712" y="366" width="103" height="22" rx="11" fill="none" stroke="#38bdf8" stroke-width="1"/><text x="763.4" y="381.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" opacity="1">MEDIUM TRUST</text><rect x="180" y="452" width="640" height="88" rx="12" fill="#131a26" stroke="#f43f5e" stroke-width="1.5"/><rect x="180" y="452" width="6" height="88" rx="3" fill="#f43f5e"/><text x="204" y="484" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">External content</text><text x="372.0" y="484" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">— tool results · retrieved docs · web pages</text><text x="204" y="512" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">Should be lowest. The model has no built-in mechanism to make it so.</text><rect x="672" y="470" width="81" height="22" rx="11" fill="#f43f5e" opacity="0.15"/><rect x="672" y="470" width="81" height="22" rx="11" fill="none" stroke="#f43f5e" stroke-width="1"/><text x="712.3" y="485.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle" opacity="1">LOW TRUST</text><rect x="60" y="562" width="880" height="56" rx="12" fill="#182130" stroke="#f43f5e" stroke-width="1.5"/><text x="84" y="596" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">The hierarchy is a convention enforced by your application design — not a technical guarantee enforced by the model.</text></svg>
