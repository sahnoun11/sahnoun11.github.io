<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Trust boundary map across an LLM application">
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e2836" stroke-width="1"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f43f5e"/></marker>
</defs>
<rect width="1200" height="800" fill="#0b0f17"/>
<rect width="1200" height="800" fill="url(#g)" opacity="0.5"/>
<text x="60" y="62" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8edf5">Mapping Trust Boundaries</text><text x="60" y="88" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8b9bb4">Six crossings where the trust level of data changes. Each one needs a control.</text><rect x="42" y="40" width="6" height="48" rx="3" fill="#ff7a1a"/><rect x="300" y="120" width="560" height="430" rx="14" fill="#101826" stroke="#ff7a1a" stroke-width="1.5" stroke-dasharray="8 6"/><text x="320" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ff7a1a" text-anchor="start" opacity="1">APPLICATION / DEVELOPER ZONE — high trust</text><rect x="890" y="120" width="250" height="430" rx="14" fill="#101826" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8 6"/><text x="908" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start" opacity="1">MODEL PROVIDER</text><text x="908" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">implicit trust</text><rect x="60" y="590" width="1080" height="170" rx="14" fill="#160f14" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="8 6"/><text x="80" y="618" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="start" opacity="1">EXTERNAL / LOW-TRUST ZONE — must be sanitised before entering the context window</text><rect x="60" y="210" width="200" height="90" rx="10" fill="#131a26" stroke="#38bdf8" stroke-width="1.5"/><text x="160" y="245" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">USER</text><text x="160" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#38bdf8" text-anchor="middle" opacity="1">medium trust</text><rect x="325" y="175" width="240" height="72" rx="10" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><text x="445.0" y="205" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Input Filter</text><text x="445.0" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">sanitise user input</text><rect x="600" y="175" width="235" height="72" rx="10" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><text x="717.5" y="205" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">System Prompt</text><text x="717.5" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">rules · persona · scope</text><rect x="325" y="285" width="510" height="72" rx="10" fill="#131a26" stroke="#a855f7" stroke-width="1.5"/><text x="580.0" y="315" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Orchestrator</text><text x="580.0" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">assembles context · routes tool calls · manages the loop</text><rect x="325" y="395" width="240" height="72" rx="10" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><text x="445.0" y="425" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Output Filter</text><text x="445.0" y="447" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">moderate before display</text><rect x="600" y="395" width="235" height="72" rx="10" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><text x="717.5" y="425" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Audit Logger</text><text x="717.5" y="447" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">log calls · tool results</text><rect x="905" y="175" width="220" height="72" rx="10" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><text x="1015" y="205" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Model API</text><text x="1015" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">auth · rate limits</text><rect x="905" y="265" width="220" height="72" rx="10" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><text x="1015" y="295" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">LLM Inference</text><text x="1015" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">GPT · Claude · Gemini</text><rect x="905" y="355" width="220" height="72" rx="10" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><text x="1015" y="385" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Safety Layer</text><text x="1015" y="407" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">provider moderation</text><rect x="905" y="445" width="220" height="72" rx="10" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><text x="1015" y="475" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Provider Logs</text><text x="1015" y="497" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">retention varies</text><rect x="85" y="645" width="235" height="80" rx="10" fill="#1c1218" stroke="#f43f5e" stroke-width="1.5"/><text x="202" y="677" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Vector Store</text><text x="202" y="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">document chunks</text><rect x="345" y="645" width="235" height="80" rx="10" fill="#1c1218" stroke="#f43f5e" stroke-width="1.5"/><text x="462" y="677" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Web Search</text><text x="462" y="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">external pages, APIs</text><rect x="605" y="645" width="235" height="80" rx="10" fill="#1c1218" stroke="#f43f5e" stroke-width="1.5"/><text x="722" y="677" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Knowledge Base</text><text x="722" y="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">internal docs · wiki</text><rect x="865" y="645" width="235" height="80" rx="10" fill="#1c1218" stroke="#f43f5e" stroke-width="1.5"/><text x="982" y="677" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#e8edf5" text-anchor="middle" opacity="1">Tool Layer</text><text x="982" y="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">email · CRM · ticketing</text><line x1="260" y1="255" x2="318" y2="212" stroke="#ff7a1a" stroke-width="2" marker-end="url(#arO)"/><circle cx="292" cy="234" r="15" fill="#0b0f17" stroke="#ff7a1a" stroke-width="2"/><text x="292" y="239" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#ff7a1a" text-anchor="middle" opacity="1">1</text><path d="M841 300 L866 300 L866 205 L898 205" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ar)"/><circle cx="866" cy="250" r="15" fill="#0b0f17" stroke="#34d399" stroke-width="2"/><text x="866" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle" opacity="1">2</text><path d="M898 300 L872 300 L872 340 L841 340" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ar)"/><circle cx="872" cy="372" r="15" fill="#0b0f17" stroke="#34d399" stroke-width="2"/><text x="872" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle" opacity="1">3</text><line x1="872" y1="340" x2="872" y2="358" stroke="#34d399" stroke-width="2"/><line x1="445" y1="360" x2="445" y2="390" stroke="#ff7a1a" stroke-width="2" marker-end="url(#arO)"/><line x1="445" y1="470" x2="445" y2="588" stroke="#f43f5e" stroke-width="2" marker-end="url(#arR)"/><circle cx="445" cy="520" r="15" fill="#0b0f17" stroke="#f43f5e" stroke-width="2"/><text x="445" y="525" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#f43f5e" text-anchor="middle" opacity="1">4</text><line x1="600" y1="588" x2="600" y2="365" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)"/><circle cx="600" cy="520" r="15" fill="#0b0f17" stroke="#f43f5e" stroke-width="2"/><text x="600" y="525" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#f43f5e" text-anchor="middle" opacity="1">5</text><line x1="990" y1="640" x2="990" y2="525" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)" opacity="0.5"/><circle cx="990" cy="578" r="15" fill="#0b0f17" stroke="#f43f5e" stroke-width="2"/><text x="990" y="583" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" fill="#f43f5e" text-anchor="middle" opacity="1">6</text></svg>
