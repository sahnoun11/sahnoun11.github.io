<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-label="The two RAG pipelines and where each one leaks">
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e2836" stroke-width="1"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f43f5e"/></marker>
</defs>
<rect width="1180" height="700" fill="#0b0f17"/>
<rect width="1180" height="700" fill="url(#g)" opacity="0.5"/>
<text x="60" y="62" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8edf5">RAG Is Two Pipelines, Not One</text><text x="60" y="88" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8b9bb4">Ingestion decides what enters the store. Retrieval decides what leaves it. Both are attack surfaces.</text><rect x="42" y="40" width="6" height="48" rx="3" fill="#ff7a1a"/><rect x="60" y="140" width="1060" height="200" rx="14" fill="#131a26" stroke="#38bdf8" stroke-width="1.5"/><rect x="60" y="140" width="1060" height="6" rx="3" fill="#38bdf8"/><text x="84" y="180" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">PIPELINE 1 — INGESTION (offline, runs before anyone asks anything)</text><rect x="84" y="200" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="106" cy="222" r="11" fill="#38bdf8" opacity="0.2"/><text x="106" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" opacity="1">1</text><text x="126" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Collect</text><text x="98" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">PDFs · wiki · tickets</text><line x1="310" y1="239" x2="328" y2="239" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)" opacity="0.7"/><rect x="336" y="200" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="358" cy="222" r="11" fill="#38bdf8" opacity="0.2"/><text x="358" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" opacity="1">2</text><text x="378" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Chunk</text><text x="350" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">paragraphs / token windows</text><line x1="562" y1="239" x2="580" y2="239" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)" opacity="0.7"/><rect x="588" y="200" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="610" cy="222" r="11" fill="#38bdf8" opacity="0.2"/><text x="610" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" opacity="1">3</text><text x="630" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Embed</text><text x="602" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">embedding model &#8594; vector</text><line x1="814" y1="239" x2="832" y2="239" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)" opacity="0.7"/><rect x="840" y="200" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="862" cy="222" r="11" fill="#38bdf8" opacity="0.2"/><text x="862" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" opacity="1">4</text><text x="882" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Store</text><text x="854" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">vector + text + metadata</text><text x="84" y="312" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#38bdf8" text-anchor="start" opacity="1">&#9888;  A poisoned document written here is retrieved by every future query that matches it. Nobody re-reviews the corpus.</text><rect x="60" y="380" width="1060" height="200" rx="14" fill="#131a26" stroke="#a855f7" stroke-width="1.5"/><rect x="60" y="380" width="1060" height="6" rx="3" fill="#a855f7"/><text x="84" y="420" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">PIPELINE 2 — RETRIEVAL (online, runs on every single query)</text><rect x="84" y="440" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="106" cy="462" r="11" fill="#a855f7" opacity="0.2"/><text x="106" y="467" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#a855f7" text-anchor="middle" opacity="1">1</text><text x="126" y="467" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Query in</text><text x="98" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">natural language question</text><line x1="310" y1="479" x2="328" y2="479" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)" opacity="0.7"/><rect x="336" y="440" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="358" cy="462" r="11" fill="#a855f7" opacity="0.2"/><text x="358" y="467" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#a855f7" text-anchor="middle" opacity="1">2</text><text x="378" y="467" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Embed query</text><text x="350" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">same model, same space</text><line x1="562" y1="479" x2="580" y2="479" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)" opacity="0.7"/><rect x="588" y="440" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="610" cy="462" r="11" fill="#a855f7" opacity="0.2"/><text x="610" y="467" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#a855f7" text-anchor="middle" opacity="1">3</text><text x="630" y="467" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Similarity search</text><text x="602" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">top-k nearest vectors</text><line x1="814" y1="479" x2="832" y2="479" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)" opacity="0.7"/><rect x="840" y="440" width="220" height="78" rx="9" fill="#182130" stroke="#1e2836" stroke-width="1.5"/><circle cx="862" cy="462" r="11" fill="#a855f7" opacity="0.2"/><text x="862" y="467" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="800" fill="#a855f7" text-anchor="middle" opacity="1">4</text><text x="882" y="467" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Inject</text><text x="854" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">into the context window</text><text x="84" y="552" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#a855f7" text-anchor="start" opacity="1">&#9888;  Similarity search has no concept of authorisation. If you do not filter by permission here, any user can reach any chunk.</text><rect x="60" y="606" width="1060" height="74" rx="12" fill="#182130" stroke="#ff7a1a" stroke-width="1.5"/><text x="84" y="636" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#ff7a1a" text-anchor="start" opacity="1">top-k is a security parameter.</text><text x="84" y="662" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1">It sets how much untrusted content is admitted per request — set it high enough and your system prompt falls out of the window entirely.</text></svg>
