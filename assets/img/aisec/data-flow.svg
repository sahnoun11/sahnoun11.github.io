<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-label="Where sensitive data in an AI application travels">
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e2836" stroke-width="1"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f43f5e"/></marker>
</defs>
<rect width="1180" height="720" fill="#0b0f17"/>
<rect width="1180" height="720" fill="url(#g)" opacity="0.5"/>
<text x="60" y="62" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8edf5">One Prompt, Six Destinations</text><text x="60" y="88" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8b9bb4">Sensitive data does not stay in the context window. It fans out to every system that touches the request.</text><rect x="42" y="40" width="6" height="48" rx="3" fill="#ff7a1a"/><rect x="430" y="300" width="320" height="130" rx="14" fill="#182130" stroke="#ff7a1a" stroke-width="2"/><text x="590" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="800" fill="#ff7a1a" text-anchor="middle" opacity="1">CONTEXT WINDOW</text><text x="590" y="366" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#e8edf5" text-anchor="middle" opacity="1">system prompt + history +</text><text x="590" y="386" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#e8edf5" text-anchor="middle" opacity="1">retrieved chunks + user input</text><text x="590" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="middle" opacity="1">one undifferentiated text buffer</text><rect x="60" y="150" width="290" height="86" rx="10" fill="#131a26" stroke="#38bdf8" stroke-width="1.5"/><text x="78" y="184" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">User input</text><text x="78" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">names, card numbers, symptoms</text><line x1="356" y1="193" x2="424" y2="330" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)" opacity="0.65"/><rect x="60" y="290" width="290" height="86" rx="10" fill="#131a26" stroke="#ff7a1a" stroke-width="1.5"/><text x="78" y="324" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">System prompt</text><text x="78" y="350" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">internal endpoints, rules</text><line x1="356" y1="333" x2="424" y2="347" stroke="#ff7a1a" stroke-width="2" marker-end="url(#ar)" opacity="0.65"/><rect x="60" y="430" width="290" height="86" rx="10" fill="#131a26" stroke="#a855f7" stroke-width="1.5"/><text x="78" y="464" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">RAG retrieval</text><text x="78" y="490" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">PII inside document chunks</text><line x1="356" y1="473" x2="424" y2="364" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)" opacity="0.65"/><rect x="60" y="570" width="290" height="86" rx="10" fill="#131a26" stroke="#34d399" stroke-width="1.5"/><text x="78" y="604" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Tool results</text><text x="78" y="630" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start" opacity="1">whole records, not the field asked for</text><line x1="356" y1="613" x2="424" y2="425" stroke="#34d399" stroke-width="2" marker-end="url(#ar)" opacity="0.65"/><rect x="800" y="145" width="320" height="72" rx="10" fill="#131a26" stroke="#f43f5e" stroke-width="1.5"/><text x="818" y="175" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Application request logs</text><text x="818" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="start" opacity="1">FULL CONTEXT</text><line x1="756" y1="365" x2="794" y2="181" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#ar)" opacity="0.5"/><rect x="800" y="233" width="320" height="72" rx="10" fill="#131a26" stroke="#f43f5e" stroke-width="1.5"/><text x="818" y="263" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Model provider servers</text><text x="818" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="start" opacity="1">FULL CONTEXT</text><line x1="756" y1="365" x2="794" y2="269" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#ar)" opacity="0.5"/><rect x="800" y="321" width="320" height="72" rx="10" fill="#131a26" stroke="#f43f5e" stroke-width="1.5"/><text x="818" y="351" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Conversation history store</text><text x="818" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="start" opacity="1">FULL CONTEXT</text><line x1="756" y1="365" x2="794" y2="357" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#ar)" opacity="0.5"/><rect x="800" y="409" width="320" height="72" rx="10" fill="#131a26" stroke="#f43f5e" stroke-width="1.5"/><text x="818" y="439" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Observability / tracing</text><text x="818" y="463" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="start" opacity="1">FULL CONTEXT, by design</text><line x1="756" y1="365" x2="794" y2="445" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#ar)" opacity="0.5"/><rect x="800" y="497" width="320" height="72" rx="10" fill="#131a26" stroke="#fbbf24" stroke-width="1.5"/><text x="818" y="527" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">User-facing response</text><text x="818" y="551" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="start" opacity="1">subset — or all of it, if injected</text><line x1="756" y1="365" x2="794" y2="533" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#ar)" opacity="0.5"/><rect x="800" y="585" width="320" height="72" rx="10" fill="#131a26" stroke="#fbbf24" stroke-width="1.5"/><text x="818" y="615" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1">Downstream tool calls</text><text x="818" y="639" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="start" opacity="1">if the agent keeps going</text><line x1="756" y1="365" x2="794" y2="621" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#ar)" opacity="0.5"/><rect x="60" y="680" width="1060" height="0" rx="10" fill="#131a26" stroke="#1e2836" stroke-width="1.5"/><text x="60" y="700" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8b9bb4" text-anchor="start" opacity="1">The multiplier effect: history is re-sent in full on every call — a card number pasted at turn 1 of a 20-turn chat is transmitted and logged 20 times.</text></svg>
