      @keyframes scan { 0%{transform:translateY(0)} 100%{transform:translateY(340px)} }
      @keyframes blink { 0%,90%,100%{opacity:1} 95%{opacity:0} }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulse2 { animation: pulse 1.8s ease-in-out infinite 0.6s; }
      .pulse3 { animation: pulse 3s ease-in-out infinite 1.1s; }
      .floatY { animation: floatY 3.5s ease-in-out infinite; }
      .scanline { animation: scan 2.6s linear infinite; opacity:0.18; }
      .blink { animation: blink 4s ease-in-out infinite; }
