<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>CTI Anime Hero — Cyber Threat Intelligence Analyst</title>
  <desc>Anime-styled illustration of a CTI analyst in a dark hoodie surrounded by holographic threat data panels, MITRE ATT&amp;CK matrices, and glowing IoC nodes in a cyberpunk blue-purple aesthetic</desc>
