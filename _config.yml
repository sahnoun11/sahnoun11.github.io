markdown: kramdown
kramdown:
  input: GFM

# Theme
theme: jekyll-theme-chirpy

# Language & timezone
lang: en
timezone: Africa/Tunis

# --------------------------
# SEO & Site Info
# --------------------------

title: Oussama Sahnoun
tagline: Cybersecurity | Red Teaming | Penetration Testing
description: >-
  Cybersecurity blog by Oussama Sahnoun. Focused on penetration testing,
  red teaming, and threat research, sharing insights, tutorials,
  and security guides for professionals and enthusiasts.

url: "https://sahnoun11.github.io"
baseurl: ""

# --------------------------
# Author / Social
# --------------------------

github:
  username: sahnoun11

twitter:
  username: Sahnounoussama5

social:
  name: Sahnoun_Oussama
  email: sahnoun.oussama11@gmail.com
  links:
    - https://x.com/Sahnounoussama5
    - https://github.com/sahnoun11
    - https://www.linkedin.com/in/oussama-sahnoun-0ba565131/

# --------------------------
# UI / Features
# --------------------------

avatar: "https://avatars.githubusercontent.com/u/35012242?v=4"
social_preview_image: "https://avatars.githubusercontent.com/u/35012242?v=4"

toc: true

# Enable PWA
pwa:
  enabled: true
  cache:
    enabled: true

# Pagination
paginate: 10

# --------------------------
# Collections & Defaults
# --------------------------

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# --------------------------
# Build settings
# --------------------------

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false
  profile: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# --------------------------
# IMPORTANT FIX
# --------------------------
# ❌ REMOVED jekyll-archives (conflict with Chirpy)
# Chirpy already handles tags & categories

# --------------------------
# Optional (recommended)
# --------------------------
env: production
